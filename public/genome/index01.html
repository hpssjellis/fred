<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Genomic Association Analyzer</title>
</head>
<body style="font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333;">

    <h2>Mini Multi-Omics / Trait Association Viewer</h2>
    <p>Loading small public dataset and computing association metrics locally...</p>
    
    <div id="statusOutput" style="padding: 10px; background: #f4f4f4; border-left: 4px solid #0066cc; margin-bottom: 20px;">
        Status: Initializing...
    </div>

    <h3>Analysis Results</h3>
    <table border="1" cellpadding="8" cellspacing="0" style="border-collapse: collapse; width: 100%;">
        <thead>
            <tr style="background: #fafafa;">
                <th>Variant / Gene ID</th>
                <th>Sample Count (n)</th>
                <th>Estimated Effect Size</th>
                <th>P-Value (Association)</th>
            </tr>
        </thead>
        <tbody id="resultsTableBody">
            <tr><td colspan="4" style="text-align: center;">Processing data...</td></tr>
        </tbody>
    </table>

    <script>
        async function runLocalGeneticAnalysis() {
            const statusOutput = document.getElementById("myStatusOutput");
            const resultsTableBody = document.getElementById("myResultsTableBody");

            try {
                statusOutput.textContent = "Status: Fetching sample dataset...";
                
                // Simulating fetching a small public dataset JSON (e.g., subset of variant data)
                // In practice, this could point to a hosted CSV or public endpoint.
                await new Promise(resolve => setTimeout(resolve, 800));
                
                const myMockDataset = [
                    { geneId: "rs12345_CFTR", values: [2.1, 2.5, 3.1, 4.2], traits: [120, 125, 130, 145] },
                    { geneId: "rs67890_Modifier", values: [1.8, 1.9, 2.0, 2.1], traits: [115, 118, 119, 120] },
                    { geneId: "rs11111_Control", values: [3.0, 1.2, 2.5, 2.2], traits: [122, 121, 123, 125] }
                ];

                statusOutput.textContent = "Status: Running statistical association calculations...";
                await new Promise(resolve => setTimeout(resolve, 800));

                // Process data using custom JS mathematical mapping (mocking a regression/score test)
                const myProcessedResults = myMockDataset.map(row => {
                    const myMeanVal = row.values.reduce((a, b) => a + b, 0) / row.values.length;
                    const myMeanTrait = row.traits.reduce((a, b) => a + b, 0) / row.traits.length;
                    
                    // Simplified pseudo-calculation for effect size and pseudo p-value
                    const myEffectSize = (myMeanVal * 1.45).toFixed(3);
                    const myPValue = (Math.random() * 0.05).toExponential(2);

                    return {
                        id: row.geneId,
                        count: row.values.length,
                        effect: myEffectSize,
                        pVal: myPValue
                    };
                });

                statusOutput.textContent = "Status: Analysis complete.";
                
                // Render results into the table
                resultsTableBody.innerHTML = "";
                myProcessedResults.forEach(res => {
                    const myRowElement = document.createElement("tr");
                    myRowElement.innerHTML = `
                        <td>${res.id}</td>
                        <td>${res.count}</td>
                        <td>${res.effect}</td>
                        <td>${res.pVal}</td>
                    `;
                    resultsTableBody.appendChild(myRowElement);
                });

            } catch (myError) {
                statusOutput.textContent = "Status Error: " + myError.message;
            }
        }

        // Execute workflow on load
        runLocalGeneticAnalysis();
    </script>
</body>
</html>
